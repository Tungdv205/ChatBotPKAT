server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: hengio-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hengio?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update        # Bản thật nên đổi sang validate và dùng Flyway/Liquibase để quản lý bảng
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

app:
  # Các khóa bí mật BẮT BUỘC đặt bằng biến môi trường khi chạy thật
  jwt-secret: ${JWT_SECRET:}          # Base64, tối thiểu 32 byte
  jwt-expire-minutes: ${JWT_EXPIRE_MINUTES:120}
  enc-key: ${APP_ENC_KEY:}            # Base64 đúng 32 byte, dùng mã hóa AES-256 cho thông tin khách hàng
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  admin-name: ${ADMIN_NAME:Quản trị viên}
  seed-demo: ${SEED_DEMO:false}
  demo-password: ${DEMO_PASSWORD:demo1234}