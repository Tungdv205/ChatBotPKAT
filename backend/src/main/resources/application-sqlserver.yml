# Chạy với SQL Server trên máy: dùng chung profile dev -> dev,sqlserver
# Mật khẩu KHÔNG ghi vào file này (tránh lộ khi đẩy GitHub), mà truyền qua biến môi trường DB_PASSWORD.
spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=hengio;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:hengio_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        use_nationalized_character_data: true